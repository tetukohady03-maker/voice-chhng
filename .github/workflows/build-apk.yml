name: Build VOXMORPH AI Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 35, NDK & CMake
        run: |
          SDK_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_BIN" --licenses || true
          "$SDK_BIN" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          if [ -f "VoxMorphAI_Source_v2.zip" ]; then unzip -qo VoxMorphAI_Source_v2.zip; fi
          if [ -f "VoxMorphAI_Android_Project.zip" ]; then unzip -qo VoxMorphAI_Android_Project.zip; fi
          if [ -f "VoxMorphAI/settings.gradle.kts" ]; then cd VoxMorphAI; fi
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VOXMORPH-AI-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
