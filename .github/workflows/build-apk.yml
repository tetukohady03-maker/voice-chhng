name: Build VOXMORPH AI Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35, NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        run: |
          if [ -f "VoxMorphAI/settings.gradle.kts" ]; then cd VoxMorphAI; fi
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VOXMORPH-AI-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
